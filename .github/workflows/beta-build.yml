name: macOS Beta Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybinder-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS beta
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PR builds do not receive the production updater key. Disable updater
      # artifacts while keeping the updater code in the app under test.
      - name: Build universal beta DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: >-
          bun run tauri build
          --target universal-apple-darwin
          --bundles dmg,app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify universal app binary
        run: >-
          lipo
          src-tauri/target/universal-apple-darwin/release/bundle/macos/keybinder.app/Contents/MacOS/keybinder
          -verify_arch arm64 x86_64

      - name: Upload beta DMG
        uses: actions/upload-artifact@v7
        with:
          name: keybinder-macos-beta-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Add test instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Keybinder macOS beta

          This universal DMG uses an ad-hoc app signature and is not notarized.
          It does not contain a signed updater artifact and is never published
          to the stable update feed. Use macOS **Open Anyway** only if you trust
          this workflow run.
          EOF
